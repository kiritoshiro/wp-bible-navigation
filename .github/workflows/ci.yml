name: CI

# Syntax, behaviour tests and a trial release package on the lowest and
# highest supported PHP. Security scans run through security-gate.yml.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Syntax and behaviour
        run: |
          find . -name '*.php' -not -path './.github/*' -print0 | xargs -0 -n1 php -l
          php tests/run.php
          node --check assets/navigation.js
          node --check assets/block.js
      - name: Trial release package
        run: python3 scripts/build-release.py v0.0.0 --any-version
